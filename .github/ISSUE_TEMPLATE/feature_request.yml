name: 改善提案
description: 利用者価値と受け入れ条件を明確にして提案します
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: 機能名ではなく、誰が何に困っているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期待する成果
      description: 実現後に何が改善したと判断できるかを記載してください。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 正常系、失敗時、権限、データ境界を含めてください。
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: リスクと未確認事項
      description: 個人情報、認証、外部サービス、運用への影響を記載してください。
